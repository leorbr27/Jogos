<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>Num Race</title>
<style>
:root{color-scheme:dark;--bg:#071426;--white:#f7f8fc;--red:#ff4d5e;--muted:#a9b7cb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#142d4c 0%,var(--bg) 60%);color:var(--white);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:min(100%,980px);padding:clamp(16px,4vw,28px);display:flex;flex-direction:column;align-items:center;gap:16px}
h1{font-size:clamp(1.4rem,5vw,2rem);margin:0;text-align:center}
.subtitle{margin:-8px 0 0;color:var(--muted);text-align:center;font-size:.94rem}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#10233ddd;border:1px solid #29405e;border-radius:16px;padding:12px 16px}
.label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.value{font-size:clamp(1.25rem,5vw,1.8rem);font-weight:800;font-variant-numeric:tabular-nums}
#time{color:var(--red)}
.settings{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.settings label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.78rem}
.settings select{min-width:0;width:100%;border:1px solid #385372;border-radius:10px;padding:10px 6px;background:#10233d;color:var(--white);font:inherit;font-size:.86rem}
.number{--diameter:clamp(34px,8.3vw,52px)}
#board.dense .number{width:clamp(25px,6vw,38px);height:clamp(25px,6vw,38px);font-size:clamp(.72rem,2.7vw,.98rem)}
@media(max-width:380px){.settings{grid-template-columns:1fr}.settings label{display:grid;grid-template-columns:95px 1fr;align-items:center}}
.stage{width:var(--stage-size,min(88vw,540px));max-width:none;flex-shrink:0;aspect-ratio:1;position:relative;display:grid;place-items:center;isolation:isolate}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid #49617e66;box-shadow:0 0 0 8px #162c461c,0 0 70px #3b79b522;pointer-events:none}
#board{position:absolute;inset:0;will-change:transform;animation:spin var(--spin-duration,42s) linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes counterspin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(-360deg)}}
.number{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);animation:counterspin var(--spin-duration,42s) linear infinite;width:clamp(34px,8.3vw,52px);height:clamp(34px,8.3vw,52px);border:1px solid #dce3ed;border-radius:50%;background:var(--white);color:#101b2c;display:grid;place-items:center;font-size:clamp(.9rem,3.6vw,1.2rem);font-weight:800;box-shadow:0 3px 9px #0004;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding:0}
.number:active{scale:.94}.number.found{background:#69e3b0;border-color:#69e3b0;color:#062a20}
.number.wrong{animation:counterspin var(--spin-duration,42s) linear infinite,shake .22s linear}
@keyframes shake{25%{translate:-3px 0}75%{translate:3px 0}}
.controls{width:100%;display:flex;gap:10px}
button.action{flex:1;border:0;border-radius:14px;padding:15px 12px;font-size:1rem;font-weight:800;cursor:pointer;background:#f5f7fb;color:#071426}
button.action.secondary{background:#1a3454;color:var(--white);border:1px solid #385372}
#message{min-height:1.5em;text-align:center;color:var(--muted);margin:0}
.note{font-size:.8rem;color:#8193aa;text-align:center;margin:0}
@media(prefers-reduced-motion:reduce){:root{--spin-duration:120s}}
</style>
</head>
<body>
<main>
<h1>Num Race</h1>
<p class="subtitle">Encontre os números em sequência enquanto a roda gira.</p>
<section class="settings" aria-label="Configurações da partida">
<label>Até o número
<select id="maxNumber" aria-label="Escolha o número máximo"></select>
</label>
<label>Tempo
<select id="duration" aria-label="Escolha a duração da partida"></select>
</label>
<label>Rotação
<select id="speed"><option value="90">Lenta</option><option value="42" selected>Normal</option><option value="20">Rápida</option></select>
</label>
</section>
<section class="hud" aria-live="polite">
<div><div class="label">Próximo número</div><div class="value" id="next">1</div></div>
<div style="text-align:right"><div class="label">Tempo restante</div><div class="value" id="time">60,0 s</div></div>
</section>
<div class="stage" aria-label="Tabuleiro circular giratório"><div class="ring"></div><div id="board"></div></div>
<section class="controls"><button class="action" id="start">Começar partida</button><button class="action secondary" id="reset">Nova disposição</button></section>
<p id="message" aria-live="polite">Toque em “Começar partida” e encontre o número 1.</p>
<p class="note">Configure a quantidade de números, o tempo e a velocidade de rotação.</p>
</main>
<script>
(()=> {
const board=document.querySelector('#board'),nextEl=document.querySelector('#next'),timeEl=document.querySelector('#time'),message=document.querySelector('#message'),startBtn=document.querySelector('#start'),resetBtn=document.querySelector('#reset');
let next=1,started=false,ended=false,endAt=0,raf=0;
const maxNumberEl=document.querySelector('#maxNumber'),durationEl=document.querySelector('#duration'),speedEl=document.querySelector('#speed');
for(let seconds=1;seconds<=300;seconds++){const option=document.createElement('option');option.value=String(seconds);option.textContent=seconds+' '+(seconds===1?'segundo':'segundos');if(seconds===60)option.selected=true;durationEl.appendChild(option)}
for(let n=10;n<=200;n++){const option=document.createElement('option');option.value=String(n);option.textContent='1 a '+n;if(n===50)option.selected=true;maxNumberEl.appendChild(option)}
function applySettings(){board.style.setProperty('--spin-duration',speedEl.value+'s');board.classList.toggle('dense',Number(maxNumberEl.value)>=60);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeBoard(){
cancelAnimationFrame(raf);board.style.animation='none';void board.offsetWidth;board.style.animation='';started=false;ended=false;next=1;nextEl.textContent='1';timeEl.textContent=Number(durationEl.value).toFixed(1).replace('.',',')+' s';startBtn.textContent='Começar partida';board.replaceChildren();applySettings();
const maxNumber=Number(maxNumberEl.value),nums=shuffle(Array.from({length:maxNumber},(_,i)=>i+1)),points=[];
const stageSize=Math.max(540,Math.ceil(320+Math.sqrt(maxNumber)*28));
board.parentElement.style.setProperty('--stage-size',stageSize+'px');
const goldenAngle=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<nums.length;i++){
 const radius=maxNumber===1?0:Math.sqrt((i+.5)/maxNumber)*.435;
 const angle=i*goldenAngle;
 points.push({x:50+Math.cos(angle)*radius*100,y:50+Math.sin(angle)*radius*100});
}
nums.forEach((n,i)=>{const b=document.createElement('button');b.className='number';b.textContent=n;b.dataset.n=n;b.style.setProperty('--x',points[i].x+'%');b.style.setProperty('--y',points[i].y+'%');b.style.animationDelay='0s';b.setAttribute('aria-label','Número '+n);b.addEventListener('click',()=>pick(n,b));board.appendChild(b)});
message.textContent='Toque em “Começar partida” e encontre o número 1.';
}
function pick(n,b){if(!started||ended)return;if(n===next){b.classList.add('found');b.disabled=true;next++;nextEl.textContent=next<=Number(maxNumberEl.value)?next:'—';if(next===Number(maxNumberEl.value)+1){finish(true);return}message.textContent='Correto! Procure o '+next+'.'}else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong')}}
function tick(){const left=Math.max(0,endAt-performance.now());timeEl.textContent=(left/1000).toFixed(1).replace('.',',')+' s';if(left<=0)finish(false);else raf=requestAnimationFrame(tick)}
function finish(won){ended=true;started=false;cancelAnimationFrame(raf);startBtn.textContent='Jogar novamente';message.textContent=won?'Excelente! Você encontrou todos os '+maxNumberEl.value+' números antes do tempo acabar.':'Tempo encerrado! Você chegou ao número '+(next-1)+'.'}
startBtn.addEventListener('click',()=>{if(started)return;if(ended)makeBoard();started=true;endAt=performance.now()+Number(durationEl.value)*1000;startBtn.textContent='Partida em andamento';message.textContent='Encontre o número 1!';tick()});
resetBtn.addEventListener('click',makeBoard);maxNumberEl.addEventListener('change',makeBoard);durationEl.addEventListener('change',makeBoard);speedEl.addEventListener('change',()=>{applySettings()});makeBoard();
})();
</script>
</body>
</html>
